name: Shared dependabot Pull Request Approve and Merge

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: "ubuntu-latest"
        type: string
      PR_URL:
        required: true
        type: string
      github_actor:
        required: true
        type: string

jobs:
  dependabot:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    # Checking the actor will prevent your Action run failing on non-Dependabot
    # PRs but also ensures that it only does work for Dependabot PRs.
    # github_actor is kept for existing callers, but the actor is only who triggered
    # the event, so the PR author must be Dependabot too (the github context here is the
    # caller's pull_request_target event). github-actions ecosystem updates (branch
    # dependabot/github_actions/...) are never auto-approved or merged: action pin bumps
    # need a human review.
    if: >-
      ${{
        inputs.github_actor == 'dependabot[bot]' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        !contains(github.event.pull_request.head.ref, 'github_actions')
      }}
    steps:
      # Re-check the author of the PR we are about to approve, since PR_URL is a caller input.
      - name: Verify PR author is Dependabot
        run: |
          author=$(gh pr view "$PR_URL" --json author --jq .author.login)
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "::error::PR author is '$author', not Dependabot. Refusing to approve or merge."
            exit 1
          fi
        env:
          PR_URL: ${{ inputs.PR_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Here the PR gets approved.
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ inputs.PR_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Finally, this sets the PR to allow auto-merging for patch and minor
      # updates if all checks pass
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --merge --auto "$PR_URL"
        env:
          PR_URL: ${{ inputs.PR_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}