name: Prod Deploy

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: "ubuntu-latest"
        type: string
      build_command:
        description: "Optional. When set, runs `npm ci` and this command, then uploads only build_output_dir. Leave unset to upload the repo as is."
        required: false
        default: ""
        type: string
      build_output_dir:
        description: "Directory the build writes, uploaded to <repo>/<build_output_dir>/ so existing URLs keep working."
        required: false
        default: "public"
        type: string
      node_version:
        description: "Node version for the build step."
        required: false
        default: "22"
        type: string

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Pulling Repo Name to use as subfolder
        run: |
          echo "REPONAME=$(echo $GITHUB_REPOSITORY | cut -d/ -f2)" >> $GITHUB_ENV

      - name: Set up Node
        if: inputs.build_command != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Build
        if: inputs.build_command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          BUILD_OUTPUT_DIR: ${{ inputs.build_output_dir }}
        run: |
          npm ci
          bash -c "$BUILD_COMMAND"
          test -d "$BUILD_OUTPUT_DIR"

      - name: Remove Unneeded Files
        run: |
          rm -r .github/ .git/

      - name: Azure Blob Storage Upload (fork)
        uses: StrongMind/azure-blob-storage-upload@main
        with:
          # The name of the storage account container these assets will be uploaded to
          container_name: "$web"
          # The name of the directory you want to upload
          source_dir: ${{ inputs.build_command != '' && format('./{0}', inputs.build_output_dir) || './' }}
          # The connection string for the storage account. Used if value is set. Either connection_string or sas_token must be supplied
          connection_string: ${{ secrets.INTERACTIVE_CONNECTION_STRING_PROD_KEY_2 }}
          # Extra arguments that can be passed to `az storage blob upload-batch|sync`. Useful for passing flags like `--pattern` or `--destination-path`
          extra_args: ${{ inputs.build_command != '' && format('--destination {0}/{1}/', env.REPONAME, inputs.build_output_dir) || format('--destination {0}/', env.REPONAME) }}

  notify_deployment:
    name: Notify Deployment
    needs: deploy
    uses:
      strongmind/public-reusable-workflows/.github/workflows/send-deployment-notification.yml@main
    with:
      repository_name: ${{ github.repository }}
    secrets: inherit