name: Dependabot Pull Request Approve and Merge

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request_target:
    branches:
      - 'main'
      - 'master'
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    uses: ./.github/workflows/shared-dependabot-auto-merge.yml
    with:
      PR_URL: ${{ github.event.pull_request.html_url }}
      github_actor: ${{ github.actor }}
    secrets: inherit
    # github.actor is whoever triggered the event, so also require Dependabot to be the PR author.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
