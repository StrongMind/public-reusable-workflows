name: Deploy to AWS

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: "ubuntu-latest-m"
        type: string
      environment-name:
        required: true
        type: string
      web-container-image:
        required: false
        type: string
        default: ${{ github.event.repository.name }}:${{ github.sha }}
      worker-container-image:
        required: false
        type: string
        default: ${{ github.event.repository.name }}:${{ github.sha }}
      pulumi-command:
        required: false
        type: string
        default: "up"
      pulumi-bucket:
        required: false
        type: string
        default: "pulumi-state-sm"
      aws-role-arn:
        description: "IAM role assumed via GitHub OIDC to run Pulumi against pulumi-state-sm"
        required: false
        type: string
        default: "arn:aws:iam::221871915463:role/gha-pulumi-deploy"
    # All optional so callers using `secrets: inherit` keep working unchanged (DEVOPS-16435).
    # GITHUB_TOKEN is not listed: it is always available and cannot be declared.
    secrets:
      STRONGMIND_AWS_ACCESS_KEY_ID:
        required: false
      STRONGMIND_AWS_SECRET_ACCESS_KEY:
        required: false
      CANVAS_AWS_ACCESS_KEY_ID:
        required: false
      CANVAS_AWS_SECRET_ACCESS_KEY:
        required: false
      PULUMI_CONFIG_PASSPHRASE:
        required: false
      RAILS_MASTER_KEY:
        required: false
      CLOUDFLARE_TOKEN:
        required: false
      BINARY_SNS_TOPIC_ARN:
        required: false
      STRONGMIND_SERVICE_UPDATES_TOPIC_ARN:
        required: false
      ID_MAPPER_TOKEN:
        required: false
      ID_MAPPER_DOMAIN:
        required: false
      DATADOG_API_KEY:
        required: false
      DATADOG_APP_KEY:
        required: false

env:
  AWS_REGION: us-west-2

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment-name }}

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Configure AWS credentials
      if: inputs.pulumi-bucket == 'pulumi-state-sm'
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials
      if: inputs.pulumi-bucket == 'pulumi-state-sm-tesla'
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ secrets.CANVAS_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.CANVAS_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1.7.1

    - name: Install Pulumi CLI
      uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0

    - name: Set up Python
      if: ${{ inputs.pulumi-command == 'refresh' ||  inputs.pulumi-command == 'down' }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.10'

    - name: Install dependencies
      if: ${{ inputs.pulumi-command == 'refresh' ||  inputs.pulumi-command == 'down' }}
      run: |
        cd ./infrastructure/
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt  
        cd ..

    - name: Deploy with Pulumi
      env:
        PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        CONTAINER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.web-container-image }}
        WORKER_CONTAINER_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.worker-container-image }}
        RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        BINARY_SNS_TOPIC_ARN: ${{ secrets.BINARY_SNS_TOPIC_ARN }}
        STRONGMIND_SERVICE_UPDATES_TOPIC_ARN: ${{ secrets.STRONGMIND_SERVICE_UPDATES_TOPIC_ARN }}
        ID_MAPPER_TOKEN: ${{ secrets.ID_MAPPER_TOKEN }}
        ID_MAPPER_DOMAIN: ${{ secrets.ID_MAPPER_DOMAIN }}
        DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
      run: |
        cd ./infrastructure/
        pulumi login s3://${{ inputs.pulumi-bucket }}/${{ github.event.repository.name }}
        pulumi stack init ${{ inputs.environment-name }} --non-interactive || true
        pulumi stack select ${{ inputs.environment-name }}
        pulumi ${{ inputs.pulumi-command }} --yes -v=3
