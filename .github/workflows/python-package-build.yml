name: Build Python Package

on: 
  workflow_call:
    inputs:
      runner:
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  Build-Publish:
    name: Build and Publish
    runs-on: ${{ inputs.runner }}
    steps:

    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Setup Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: "3.10"

    # hardcoded pip version to avoid bug in pip 23.2 (please reference to https://strongmind.atlassian.net/browse/DEVOPS-9181?focusedCommentId=234025)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        make install

    - name: Pytest
      run: |
        make test

    - name: package files
    # major version changed during the Azure migration engagement with Caylent.
      run: |
        cd deployment
        pip install hatch
        hatch version 1.1.${{ github.run_number }}
        cd .. && make build 

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ github.sha }}
        path: 'dist/*'

  Upload-Package:
    name: Upload Package
    needs: Build-Publish
    runs-on: ${{ inputs.runner }}
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: ${{ github.sha }}
        path: 'dist'

    - name: Publish a Python distribution to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        password: ${{secrets.PYPITOKEN}}
